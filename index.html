    img:'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?q=80&w=800&auto=format&fit=crop' },

  { id:'pistcookie', cat:'bakery', price:15, origin:null,
    name:{ar:'كوكيز الفستق',en:'Pistachio Cookies'},
    desc:{ar:'قوام طري من الداخل ومقرمش من الأطراف، محشو بقطع فستق حلبي فاخرة.',en:'Soft-centered with crisp edges, loaded with premium Aleppo pistachio pieces.'},
    notes:{ar:['فستق حلبي','زبدة بنية'],en:['Aleppo Pistachio','Brown Butter']},
    img:'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?q=80&w=800&auto=format&fit=crop', badge:{ar:'جديد',en:'New'} },

  { id:'cinnamonroll', cat:'bakery', price:18, origin:null,
    name:{ar:'سينامون رول',en:'Cinnamon Roll'},
    desc:{ar:'عجينة طرية ملفوفة بالقرفة والسكر البني، مغطاة بجلاسيه الجبن الكريمي.',en:'Soft dough rolled with cinnamon and brown sugar, finished with a cream-cheese glaze.'},
    notes:{ar:['قرفة','جلاسيه جبن كريمي'],en:['Cinnamon','Cream-Cheese Glaze']},
    img:'https://images.unsplash.com/photo-1509365465985-25d11c17e812?q=80&w=800&auto=format&fit=crop' },
];

/* =====================================================================
   i18n dictionary — كل نصوص الواجهة الثابتة
   ===================================================================== */
const UI = {
  ar: {
    dir:'rtl', lang:'ar', langBtn:'EN',
    logoWord:'هيمي', logoSub:'مقهى ومحمصة',
    hours:'مفتوح 24/7',
    searchPh:'ابحث عن صنف، نكهة، أو منشأ...',
    tabs:{ all:'الكل', single:'قهوة أصل واحد', hot:'إسبرسو ومشروبات ساخنة', cold:'مشروبات باردة', bakery:'مخبوزات وحلويات' },
    resultsCount:(n)=> n + ' صنف' ,
    empty:'لا توجد أصناف مطابقة لبحثك',
    notesLabel:'ملاحظات التذوق',
    roastLabel:'درجة التحميص',
    roastLight:'فاتح', roastDark:'داكن',
    price:(p)=> p + ' ر.س',
    footerTagline:'قهوة مختصة، محمصة بخبرة وإتقان — جدة، المملكة العربية السعودية',
  },
  en: {
    dir:'ltr', lang:'en', langBtn:'AR',
    logoWord:'hemi', logoSub:'Coffee Roasters',
    hours:'Open 24/7',
    searchPh:'Search a dish, flavor, or origin...',
    tabs:{ all:'All', single:'Single Origin', hot:'Espresso & Hot', cold:'Cold Drinks', bakery:'Bakery & Desserts' },
    resultsCount:(n)=> n + ' items',
    empty:'No items match your search',
    notesLabel:'Tasting Notes',
    roastLabel:'Roast Level',
    roastLight:'Light', roastDark:'Dark',
    price:(p)=> 'SAR ' + p,
    footerTagline:'Specialty coffee, roasted with care and precision — Jeddah, Saudi Arabia',
  }
};

const ROAST_LEVELS = 5; // 1 = light ... 5 = dark, used for the marker position

let state = { lang:'ar', cat:'all', query:'' };

/* ---------------------------- helpers ---------------------------- */
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

function applyTextDirection() {
  const t = UI[state.lang];
  document.documentElement.setAttribute('lang', t.lang);
  document.documentElement.setAttribute('dir', t.dir);
}

function renderStaticText() {
  const t = UI[state.lang];
  $('#langBtnLabel').textContent = t.langBtn;
  $('#logoWord').textContent = t.logoWord;
  $('#logoSub').textContent = t.logoSub;
  $('#hoursText').textContent = t.hours;
  $('#searchInput').placeholder = t.searchPh;
  $('#emptyText').textContent = t.empty;
  $('#footerTagline').textContent = t.footerTagline;
}

/* ---------------------------- tabs ---------------------------- */
function renderTabs() {
  const t = UI[state.lang];
  const wrap = $('#tabsWrap');
  wrap.innerHTML = '';
  const cats = ['all','single','hot','cold','bakery'];
  cats.forEach((c) => {
    const btn = el('button', 'tap-scale shrink-0 whitespace-nowrap rounded-full border px-4 py-2 text-[13px] font-bold font-display');
    btn.textContent = t.tabs[c];
    btn.dataset.cat = c;
    const active = state.cat === c;
    btn.className += active
      ? ' border-gold bg-gold text-ink shadow-goldGlow'
      : ' border-white/12 bg-white/5 text-beige/70 hover:border-white/25';
    btn.addEventListener('click', () => { state.cat = c; renderTabs(); renderGrid(); });
    wrap.appendChild(btn);
  });
}

/* ---------------------------- roast dots (card) ---------------------------- */
function roastDots(level) {
  if (!level) return '';
  let dots = '';
  for (let i = 1; i <= ROAST_LEVELS; i++) {
    dots += `<span class="h-1.5 w-1.5 rounded-full ${i <= level ? 'bg-gold' : 'bg-white/15'}"></span>`;
  }
  return `<div class="flex items-center gap-1">${dots}</div>`;
}

/* ---------------------------- grid ---------------------------- */
function filteredItems() {
  const q = state.query.trim().toLowerCase();
  return MENU.filter((item) => {
    if (state.cat !== 'all' && item.cat !== state.cat) return false;
    if (!q) return true;
    const hay = [
      item.name.ar, item.name.en, item.desc.ar, item.desc.en,
      ...(item.notes ? [...item.notes.ar, ...item.notes.en] : []),
      item.origin ? item.origin.ar : '', item.origin ? item.origin.en : '',
    ].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function renderGrid() {
  const t = UI[state.lang];
  const grid = $('#grid');
  const items = filteredItems();
  grid.innerHTML = '';
  $('#resultCount').textContent = t.resultsCount(items.length);

  $('#emptyState').classList.toggle('hidden', items.length !== 0);
  $('#emptyState').classList.toggle('flex', items.length === 0);

  items.forEach((item, i) => {
    const card = el('button', 'fade-item tap-scale group relative flex w-full items-center gap-4 rounded-2xl border border-white/8 bg-white/[0.035] p-3 text-start shadow-card hover:border-gold/30');
    card.style.animationDelay = (i * 35) + 'ms';
    card.addEventListener('click', () => openModal(item));

    card.innerHTML = `
      <div class="relative h-20 w-20 shrink-0 overflow-hidden rounded-xl bg-ink-100">
        <img src="${item.img}" loading="lazy" alt="" class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,${encodeURIComponent(fallbackSVG())}'" />
        ${item.badge ? `<span class="absolute -top-1.5 -start-1.5 rounded-full bg-gold px-1.5 py-0.5 text-[8px] font-extrabold text-ink shadow">${item.badge[state.lang]}</span>` : ''}
      </div>
      <div class="min-w-0 flex-1">
        ${item.origin ? `<p class="mb-0.5 truncate text-[10px] font-bold uppercase tracking-wider text-gold/70">${item.origin[state.lang]}</p>` : ''}
        <div class="flex items-start justify-between gap-2">
          <h3 class="truncate font-display text-[15px] font-bold text-beige-100">${item.name[state.lang]}</h3>
        </div>
        <p class="mt-0.5 line-clamp-1 text-xs text-beige/45">${item.desc[state.lang]}</p>
        <div class="mt-2 flex items-center justify-between">
          ${item.roast ? roastDots(item.roast) : '<span></span>'}
          <span class="font-wordmark text-sm font-semibold text-gold">${t.price(item.price)}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function fallbackSVG() {
  return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#3a3733'/><text x='50' y='56' font-size='34' text-anchor='middle' fill='#EFBD45' font-family='sans-serif'>☕</text></svg>`;
}

/* ---------------------------- modal ---------------------------- */
function openModal(item) {
  const t = UI[state.lang];
  $('#modalImg').src = item.img;
  $('#modalImg').onerror = function () { this.onerror = null; this.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(fallbackSVG()); };
  $('#modalOrigin').textContent = item.origin ? item.origin[state.lang] : t.tabs[item.cat];
  $('#modalName').textContent = item.name[state.lang];
  $('#modalPrice').textContent = t.price(item.price);
  $('#modalDesc').textContent = item.desc[state.lang];

  const badgeEl = $('#modalBadge');
  if (item.badge) { badgeEl.textContent = item.badge[state.lang]; badgeEl.classList.remove('hidden'); }
  else { badgeEl.classList.add('hidden'); }

  $('#modalNotesLabel').textContent = t.notesLabel;
  const notesWrap = $('#modalNotes');
  notesWrap.innerHTML = '';
  (item.notes ? item.notes[state.lang] : []).forEach((n) => {
    const chip = el('span', 'chip rounded-full border border-gold/25 bg-gold/10 px-3 py-1 text-xs font-semibold text-gold');
    chip.textContent = n;
    notesWrap.appendChild(chip);
  });

  const roastWrap = $('#modalRoastWrap');
  if (item.roast) {
    roastWrap.classList.remove('hidden');
    $('#modalRoastLabel').textContent = t.roastLabel;
    $('#modalRoastValue').textContent = item.roast <= 2 ? t.roastLight : (item.roast >= 4 ? t.roastDark : '');
    $('#roastLightLabel').textContent = t.roastLight;
    $('#roastDarkLabel').textContent = t.roastDark;
    const pct = ((item.roast - 1) / (ROAST_LEVELS - 1)) * 100;
    $('#modalRoastMarker').style.left = pct + '%';
  } else {
    roastWrap.classList.add('hidden');
  }

  const overlay = $('#modalOverlay');
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
  document.body.classList.add('modal-open');
  requestAnimationFrame(() => { $('#modalCard').style.transform = 'translateY(0)'; });
}

function closeModal() {
  $('#modalOverlay').classList.add('hidden');
  $('#modalOverlay').classList.remove('flex');
  document.body.classList.remove('modal-open');
}

$('#modalClose').addEventListener('click', closeModal);
$('#modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ---------------------------- search ---------------------------- */
let searchTimer;
$('#searchInput').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(() => { state.query = val; renderGrid(); }, 120);
});

/* ---------------------------- language toggle ---------------------------- */
$('#langBtn').addEventListener('click', () => {
  state.lang = state.lang === 'ar' ? 'en' : 'ar';
  applyTextDirection();
  renderStaticText();
  renderTabs();
  renderGrid();
});

/* ---------------------------- init ---------------------------- */
applyTextDirection();
renderStaticText();
renderTabs();
renderGrid();
</script>
</body>
</html>
